countdown-seconds: 10
language: zh_cn
max-players: 32
team-size: 4
default-initial-border-radius: 120.0
save-world-on-unload: false

lobby:
  world: world
  spawn:
    x: 0.5
    y: 80.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  scoreboard:
    title: "&b&l✦ SKYBATTLE ✦"
    lines:
      - "&8&m                    "
      - "&f玩家 &8» &b{player}"
      - ""
      - "&c击杀 &8» &f{kills}"
      - "&6获胜 &8» &f{wins}"
      - "&b积分 &8» &f{experience}"
      - ""
      - "&e开局 &8» &f/skb start"
      - "&e榜单 &8» &f/skb board"
      - "&8&m                    "

return:
  world: world
  point:
    x: 0.5
    y: 80.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

stats:
  storage:
    # sqlite 为默认本地存储；mysql/postgresql 请填写 jdbc-url、username、password。
    type: sqlite
    sqlite-file: stats.db
    jdbc-url: ""
    username: ""
    password: ""
  rewards:
    kill-experience: 10
    win-experience: 50
