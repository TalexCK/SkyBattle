# Sky Battle solo - legendary chest
# Each chest picks `rolls` different variants by weight. A variant can hold several items.
# Item keys: material | alias (special items), amount, name, lore, enchantments (minecraft keys).
# Aliases: timed_orb_of_harming, orb_of_poison, orb_of_slowness, orb_of_cleansing,
#          spark_of_levitation, spark_of_regeneration, spark_of_speed
rolls: 3
variants:
- weight: 3
  items:
  - material: DIAMOND_SWORD
    enchantments:
      sharpness: 2
- weight: 2
  items:
  - material: DIAMOND_CHESTPLATE
    enchantments:
      protection: 2
- weight: 2
  items:
  - material: ENCHANTED_GOLDEN_APPLE
- weight: 2
  items:
  - material: BOW
    enchantments:
      power: 3
      punch: 1
- weight: 2
  items:
  - alias: spark_of_regeneration
    amount: 2
- weight: 1.5
  items:
  - material: ENDER_PEARL
    amount: 2
- weight: 1.5
  items:
  - material: TNT
    amount: 3
