    name: "&bOrb of Cleansing"
    lore:
      - "&7Right click to throw. Removes negative effects"
      - "&7and fire from everyone within &f3.5 &7blocks."
  spark_of_levitation:
    name: "&fSpark of Levitation"
    lore:
      - "&7Right click to float about &f13 &7blocks up over &f2.5s&7."
